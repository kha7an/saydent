# Include inside nginx's http {} context. Replace domain and certificate paths.
limit_req_zone $binary_remote_addr zone=saydent_forms:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=saydent_connections:10m;

server {
    listen 80;
    server_name saydent.example.ru;
    return 301 https://saydent.example.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name saydent.example.ru;
    ssl_certificate /etc/letsencrypt/live/saydent.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saydent.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    limit_conn saydent_connections 10;

    location = /api/appointments {
        limit_req zone=saydent_forms burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
}
